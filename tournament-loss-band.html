<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SMATournament — 順位決定戦（敗戦帯）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header__inner">
        <div>
          <p class="app-header__brand">SMATournament</p>
          <h1 class="app-header__title">順位決定戦</h1>
        </div>
        <div id="headerActions" class="user-bar hidden">
          <a href="#" class="btn btn--ghost" id="backToDashboardBtn">大会管理へ戻る</a>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section id="viewLoading" class="panel" aria-live="polite">
        <p>読み込み中…</p>
      </section>

      <section id="viewConfig" class="panel hidden">
        <h2 class="panel__title">設定が必要です</h2>
        <div id="configAlert"></div>
      </section>

      <section id="viewOperatorDenied" class="panel hidden">
        <h2 class="panel__title">アクセスできません</h2>
        <div id="operatorDeniedAlert"></div>
        <a href="index.html" class="btn btn--ghost btn--block">トップへ戻る</a>
      </section>

      <section id="viewError" class="panel hidden">
        <h2 class="panel__title">順位決定戦を表示できません</h2>
        <div id="errorAlert"></div>
        <a href="index.html" class="btn btn--primary btn--block">大会一覧へ戻る</a>
      </section>

      <section id="viewEmpty" class="panel hidden">
        <h2 class="panel__title">まだ開始されていません</h2>
        <p class="panel__desc" id="emptyDesc">大会管理から順位決定戦（32 / 64 / 128枠）を開始してください。</p>
        <a href="#" class="btn btn--primary btn--block" id="emptyDashboardBtn">大会管理へ戻る</a>
      </section>

      <section id="viewMain" class="hidden">
        <div class="panel loss-band-ops__header">
          <h2 class="panel__title" id="tournamentNameEl">—</h2>
          <p class="panel__desc" id="statusLineEl">—</p>
          <dl class="info-list" id="metaListEl"></dl>
        </div>

        <div class="panel" id="progressPanel">
          <h3 class="panel__title">進行状況</h3>
          <p class="panel__desc" id="progressLineEl">—</p>
        </div>

        <div class="panel hidden" id="editRoundPanel">
          <div class="loss-band-ops__round-sticky">
            <h3 class="panel__title" id="editRoundTitleEl">完了ラウンド（結果修正）</h3>
          </div>
          <p class="panel__desc" id="editRoundHintEl"></p>
          <div id="editBandsRoot"></div>
        </div>

        <div class="panel loss-band-ops__round-panel">
          <div class="loss-band-ops__round-sticky">
            <h3 class="panel__title" id="roundTitleEl">ラウンド</h3>
          </div>
          <div id="bandsRoot"></div>
        </div>

        <div class="panel hidden" id="placementsPanel">
          <h3 class="panel__title">順位（lossBandPlacements）</h3>
          <p class="panel__desc">公開順位表への統合前の内部確定です。</p>
          <div id="placementsRoot"></div>
        </div>

        <div class="panel hidden" id="exchangePanel">
          <h3 class="panel__title">交流戦</h3>
          <p class="panel__desc">順位表示とは別枠です。保証試合数未達チームのみ。</p>
          <div id="exchangeRoot"></div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="js/ui/pages/tournament-loss-band-page.js"></script>
</body>
</html>
