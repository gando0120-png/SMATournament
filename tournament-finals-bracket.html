<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SMATournament — 決勝トーナメント</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header__inner">
        <div>
          <p class="app-header__brand">SMATournament</p>
          <h1 class="app-header__title">決勝トーナメント</h1>
        </div>
        <div id="headerActions" class="user-bar hidden">
          <a href="#" class="btn btn--ghost" id="openAdvancementBtn">決勝進出</a>
          <a href="#" class="btn btn--ghost" id="backToDashboardBtn">大会管理へ戻る</a>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section id="viewLoading" class="panel" aria-live="polite">
        <p>読み込み中…</p>
      </section>

      <section id="viewConfig" class="panel hidden">
        <h2 class="panel__title">設定が必要です</h2>
        <div id="configAlert"></div>
      </section>

      <section id="viewOperatorDenied" class="panel hidden">
        <h2 class="panel__title">アクセスできません</h2>
        <div id="operatorDeniedAlert"></div>
        <a href="index.html" class="btn btn--ghost btn--block">トップへ戻る</a>
      </section>

      <section id="viewError" class="panel hidden">
        <h2 class="panel__title">決勝トーナメントを表示できません</h2>
        <div id="errorAlert"></div>
        <a href="index.html" class="btn btn--primary btn--block">大会一覧へ戻る</a>
      </section>

      <section id="viewEmpty" class="panel hidden">
        <h2 class="panel__title">決勝進出が未確定です</h2>
        <p class="panel__desc">先に決勝進出チームを確定してください。</p>
        <a href="#" class="btn btn--primary btn--block" id="emptyAdvancementBtn">決勝進出を確定</a>
      </section>

      <section id="viewInvalid" class="panel hidden">
        <h2 class="panel__title">トーナメント表を作成できません</h2>
        <div id="invalidAlert"></div>
        <a href="#" class="btn btn--ghost btn--block" id="invalidAdvancementBtn">決勝進出を確認</a>
      </section>

      <section id="viewBracket" class="hidden">
        <div class="panel" style="margin-bottom: var(--space-lg);">
          <div class="panel-header-row">
            <div>
              <h2 class="panel__title" id="bracketPageTitle">決勝トーナメント</h2>
              <p class="panel__desc" id="bracketMeta">—</p>
            </div>
            <span class="status-badge hidden" id="finalizedBadge" data-status="confirmed">確定済み</span>
          </div>
        </div>

        <div class="panel" style="margin-bottom: var(--space-lg);">
          <h3 class="panel__title">進出チーム（seed 順）</h3>
          <div class="standings-table-wrap">
            <table class="standings-table" id="qualifiersTable">
              <thead>
                <tr>
                  <th scope="col">Seed</th>
                  <th scope="col">チーム</th>
                  <th scope="col">ブロック</th>
                </tr>
              </thead>
              <tbody id="qualifiersBody"></tbody>
            </table>
          </div>
        </div>

        <div id="championPanel" class="panel hidden" style="margin-bottom: var(--space-lg);">
          <h3 class="panel__title">決勝結果</h3>
          <p class="panel__desc" id="championLine">—</p>
          <p class="panel__desc" id="runnerUpLine">—</p>
        </div>

        <div id="finalizeResultsPanel" class="panel hidden" style="margin-bottom: var(--space-lg);">
          <h3 class="panel__title">大会結果の確定</h3>
          <p class="panel__desc">決勝戦が終了しました。大会結果を確定してください。</p>
          <a href="#" class="btn btn--primary" id="openResultsPageBtn">大会結果を確定</a>
        </div>

        <div id="bracketRounds" class="finals-bracket"></div>

        <div class="panel hidden" id="finalizePanel" style="margin-top: var(--space-lg);">
          <button type="button" class="btn btn--primary" id="finalizeBracketBtn">このトーナメントで確定</button>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="js/ui/pages/tournament-finals-bracket-page.js"></script>
</body>
</html>
