<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SMATournament — エントリー管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header__inner">
        <div>
          <p class="app-header__brand">SMATournament</p>
          <h1 class="app-header__title">エントリー管理</h1>
        </div>
        <div id="headerActions" class="user-bar hidden">
          <a href="#" class="btn btn--ghost" id="backToDashboardBtn">大会管理へ戻る</a>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section id="viewLoading" class="panel" aria-live="polite">
        <p>読み込み中…</p>
      </section>

      <section id="viewConfig" class="panel hidden">
        <h2 class="panel__title">設定が必要です</h2>
        <div id="configAlert"></div>
        <p class="panel__desc">
          <code>js/firebase-config.js</code> に Firebase Web 設定を入力してください。
        </p>
      </section>

      <section id="viewOperatorDenied" class="panel hidden">
        <h2 class="panel__title">アクセスできません</h2>
        <div id="operatorDeniedAlert"></div>
        <p class="panel__desc">
          Firebase Console で <code>operators/{uid}</code> ドキュメントを登録後、再度ログインしてください。
        </p>
        <a href="index.html" class="btn btn--ghost btn--block">トップへ戻る</a>
      </section>

      <section id="viewError" class="panel hidden">
        <h2 class="panel__title">エントリーを表示できません</h2>
        <div id="errorAlert"></div>
        <a href="index.html" class="btn btn--primary btn--block">大会一覧へ戻る</a>
      </section>

      <section id="viewEntries" class="hidden">
        <div class="panel" style="margin-bottom: var(--space-lg);">
          <h2 class="panel__title" id="tournamentName">—</h2>
          <dl class="entry-stats" id="entryStats">
            <div class="entry-stats__row">
              <dt>全エントリー数</dt>
              <dd id="entryTotalCount">—</dd>
            </div>
            <div class="entry-stats__row">
              <dt>申込中</dt>
              <dd id="entryPendingCount">—</dd>
            </div>
            <div class="entry-stats__row">
              <dt>参加確定</dt>
              <dd id="entryConfirmedCount">—</dd>
            </div>
          </dl>
        </div>

        <div class="panel">
          <h3 class="panel__title">エントリー一覧</h3>
          <div id="entryEmpty" class="empty-state hidden">
            <p>エントリーはまだありません。</p>
          </div>
          <div id="entryList" class="entry-row-list"></div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="js/ui/pages/tournament-entries-page.js"></script>
</body>
</html>
