<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SMATournament — 予選結果入力</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header__inner">
        <div>
          <p class="app-header__brand">SMATournament</p>
          <h1 class="app-header__title">予選結果入力</h1>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section id="viewLoading" class="panel" aria-live="polite">
        <p>読み込み中…</p>
      </section>

      <section id="viewConfig" class="panel hidden">
        <h2 class="panel__title">設定が必要です</h2>
        <div id="configAlert"></div>
      </section>

      <section id="viewError" class="panel hidden">
        <h2 class="panel__title">結果入力を開けません</h2>
        <div id="errorAlert"></div>
      </section>

      <section id="viewTeamNumber" class="panel hidden">
        <h2 class="panel__title" id="teamPickerTitle">チームを選択してください</h2>
        <p class="panel__desc" id="teamPickerDesc">会場掲示のURLから開いています。自チームを選んでください。</p>
        <label class="field" for="teamSearchInput">
          <span class="field__label">チーム番号またはチーム名</span>
          <input
            class="field__input"
            id="teamSearchInput"
            type="search"
            enterkeyhint="search"
            autocomplete="off"
            placeholder="例: 07 / 庄内"
          >
        </label>
        <p class="form-alert form-alert--error hidden" id="teamNumberAlert" role="alert"></p>
        <p class="panel__desc" id="teamChoiceCount" style="margin-top: var(--space-sm);"></p>
        <div
          id="teamChoiceList"
          class="team-choice-list"
          role="listbox"
          aria-label="参加チーム一覧"
        ></div>
      </section>

      <section id="viewMain" class="panel hidden">
        <h2 class="panel__title" id="tournamentName">—</h2>
        <p class="panel__desc" id="teamSummary">—</p>
        <p class="form-alert form-alert--warning hidden" id="gateAlert"></p>
        <div class="button-row" style="margin-bottom: var(--space-md);">
          <button type="button" class="btn btn--ghost" id="changeTeamBtn">チームを選び直す</button>
        </div>
        <div id="matchList" style="margin-top: var(--space-md);"></div>
      </section>
    </main>
  </div>

  <script type="module" src="js/ui/pages/player-results-page.js"></script>
</body>
</html>
