<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SMATournament — 大会作成</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header__inner">
        <div>
          <p class="app-header__brand">SMATournament</p>
          <h1 class="app-header__title">大会作成</h1>
        </div>
        <div id="headerActions" class="user-bar hidden">
          <a href="index.html" class="btn btn--ghost">一覧へ戻る</a>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section id="viewLoading" class="panel" aria-live="polite">
        <p>読み込み中…</p>
      </section>

      <section id="viewConfig" class="panel hidden">
        <h2 class="panel__title">設定が必要です</h2>
        <div id="configAlert"></div>
        <p class="panel__desc">
          <code>js/firebase-config.js</code> に Firebase Web 設定を入力してください。
        </p>
      </section>

      <section id="viewOperatorDenied" class="panel hidden">
        <h2 class="panel__title">アクセスできません</h2>
        <div id="operatorDeniedAlert"></div>
        <p class="panel__desc">
          Firebase Console で <code>operators/{uid}</code> ドキュメントを登録後、再度ログインしてください。
        </p>
        <a href="index.html" class="btn btn--ghost btn--block">トップへ戻る</a>
      </section>

      <section id="viewForm" class="panel hidden">
        <h2 class="panel__title">新しい大会</h2>
        <p class="panel__desc">作成直後は下書き（draft）状態です。管理画面からエントリー受付を開始できます。</p>
        <div id="formAlert"></div>
        <form id="tournamentForm" novalidate>
          <label class="field" for="name">
            <span class="field__label">大会名</span>
            <input class="field__input" type="text" id="name" name="name" required maxlength="100">
          </label>
          <label class="field" for="eventDate">
            <span class="field__label">開催日</span>
            <input class="field__input" type="date" id="eventDate" name="eventDate" required>
          </label>
          <label class="field" for="venue">
            <span class="field__label">会場</span>
            <input class="field__input" type="text" id="venue" name="venue" required maxlength="200">
          </label>
          <label class="field" for="entryDeadline">
            <span class="field__label">エントリー締切</span>
            <input class="field__input" type="datetime-local" id="entryDeadline" name="entryDeadline" required>
          </label>
          <label class="field" for="maxTeams">
            <span class="field__label">募集チーム数</span>
            <input class="field__input" type="number" id="maxTeams" name="maxTeams" min="2" max="999" required>
          </label>
          <label class="field" for="teamSize">
            <span class="field__label">1チームの人数</span>
            <input class="field__input" type="number" id="teamSize" name="teamSize" min="1" max="20" required>
          </label>
          <label class="field" for="courtCount">
            <span class="field__label">使用コート数</span>
            <input class="field__input" type="number" id="courtCount" name="courtCount" min="1" max="99" required>
          </label>
          <label class="field" for="preferredBlockSize">
            <span class="field__label">ブロック基本人数（preferredBlockSize）</span>
            <input class="field__input" type="number" id="preferredBlockSize" name="preferredBlockSize" min="2" max="20" value="4">
          </label>
          <div class="form-actions">
            <a href="index.html" class="btn btn--ghost">キャンセル</a>
            <button type="submit" class="btn btn--primary" id="submitBtn">大会を作成</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script type="module" src="js/ui/pages/tournament-new-page.js"></script>
</body>
</html>
