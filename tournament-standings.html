<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SMATournament — 予選順位表</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header__inner">
        <div>
          <p class="app-header__brand">SMATournament</p>
          <h1 class="app-header__title">予選順位表</h1>
        </div>
        <div id="headerActions" class="user-bar hidden">
          <a href="#" class="btn btn--ghost" id="openScheduleBtn">予選対戦表を開く</a>
          <a href="#" class="btn btn--ghost" id="openFinalsAdvancementBtn">決勝進出</a>
          <a href="#" class="btn btn--ghost hidden" id="openFinalsBracketBtn">決勝トーナメント</a>
          <a href="#" class="btn btn--ghost" id="backToDashboardBtn">大会管理へ戻る</a>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section id="viewLoading" class="panel" aria-live="polite">
        <p>読み込み中…</p>
      </section>

      <section id="viewConfig" class="panel hidden">
        <h2 class="panel__title">設定が必要です</h2>
        <div id="configAlert"></div>
        <p class="panel__desc">
          <code>js/firebase-config.js</code> に Firebase Web 設定を入力してください。
        </p>
      </section>

      <section id="viewOperatorDenied" class="panel hidden">
        <h2 class="panel__title">アクセスできません</h2>
        <div id="operatorDeniedAlert"></div>
        <p class="panel__desc">
          Firebase Console で <code>operators/{uid}</code> ドキュメントを登録後、再度ログインしてください。
        </p>
        <a href="index.html" class="btn btn--ghost btn--block">トップへ戻る</a>
      </section>

      <section id="viewError" class="panel hidden">
        <h2 class="panel__title">順位表を表示できません</h2>
        <div id="errorAlert"></div>
        <a href="index.html" class="btn btn--primary btn--block">大会一覧へ戻る</a>
      </section>

      <section id="viewEmpty" class="panel hidden">
        <h2 class="panel__title">予選対戦表が未確定です</h2>
        <p class="panel__desc">予選対戦表を確定してから、ブロック別順位表を表示できます。</p>
        <a href="#" class="btn btn--primary btn--block" id="emptyScheduleBtn">予選対戦表を開く</a>
        <a href="#" class="btn btn--ghost btn--block" id="emptyBackBtn">大会管理へ戻る</a>
      </section>

      <section id="viewStandings" class="hidden">
        <div class="panel" style="margin-bottom: var(--space-lg);">
          <h2 class="panel__title" id="standingsPageTitle">予選順位表</h2>
          <p class="panel__desc" id="standingsMeta">—</p>
        </div>
        <div id="standingsBlocks"></div>
      </section>
    </main>
  </div>

  <script type="module" src="js/ui/pages/tournament-standings-page.js"></script>
</body>
</html>
