<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SMATournament — 組み合わせ表</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/combination-sheet.css">
</head>
<body class="combination-sheet-body">
  <div class="combination-sheet-toolbar no-print" id="sheetToolbar">
    <a href="#" class="btn btn--ghost" id="backBtn">戻る</a>
    <div class="combination-sheet-toolbar__actions">
      <button type="button" class="btn btn--primary hidden" id="printBtn">印刷・PDF保存</button>
    </div>
    <p class="combination-sheet-print-hint no-print hidden" id="printHint">
      スマートフォンでは、このボタンから印刷画面が開かない場合があります。そのときはブラウザのメニューから「共有」または「印刷」を選び、PDFとして保存してください。
    </p>
  </div>

  <section id="viewLoading" class="combination-sheet-status" aria-live="polite">
    <h1>読み込み中…</h1>
    <p>組み合わせ表を準備しています。</p>
  </section>

  <section id="viewConfig" class="combination-sheet-status hidden">
    <h1>設定が必要です</h1>
    <div id="configAlert"></div>
    <p><code>js/firebase-config.js</code> に Firebase Web 設定を入力してください。</p>
    <p style="margin-top: 1rem;"><a href="index.html" class="btn btn--ghost">トップへ戻る</a></p>
  </section>

  <section id="viewOperatorDenied" class="combination-sheet-status hidden">
    <h1>アクセスできません</h1>
    <div id="operatorDeniedAlert"></div>
    <p>この大会を管理する権限がありません。</p>
    <p style="margin-top: 1rem;"><a href="index.html" class="btn btn--ghost">トップへ戻る</a></p>
  </section>

  <section id="viewError" class="combination-sheet-status hidden">
    <h1>組み合わせ表を表示できません</h1>
    <p id="errorMessage">大会データが不正です。</p>
    <p style="margin-top: 1rem;"><a href="#" class="btn btn--ghost" id="errorBackBtn">大会管理へ戻る</a></p>
  </section>

  <section id="viewSheet" class="combination-sheet-preview hidden">
    <div id="sheetRoot"></div>
  </section>

  <script type="module" src="js/ui/pages/combination-sheet-page.js"></script>
</body>
</html>
